<!-- sg-obsidian section. Finished at rest with CSS alone: the stacked fracture
     planes and their lit edges in .fx-obsidian__rest are the hero with
     JavaScript off, and index.js only covers them with a WebGL canvas once it
     has the shader, a context and a linked program. The _fx paths are
     root-absolute because a site always sits at the origin root, and
     "./_fx/..." would break on a nested page such as /blog/post.html. The three
     decorative layers carry aria-hidden; the copy is the only thing a screen
     reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/sg-obsidian/style.css">
<section class="fx-obsidian" data-fx="sg-obsidian">
  <div class="fx-obsidian__rest" aria-hidden="true"></div>
  <div class="fx-obsidian__scrim" aria-hidden="true"></div>
  <div class="fx-obsidian__grain" aria-hidden="true"></div>
  <div class="fx-obsidian__inner">
    <p class="fx-obsidian__eyebrow"><span class="fx-obsidian__dot" aria-hidden="true"></span>Cut once</p>
    <h1 class="fx-obsidian__title">Every edge here was made by breaking something.</h1>
    <p class="fx-obsidian__lede">Swap this for your own words. The headline takes one line or three, and the light keeps travelling across the break either way.</p>
    <div class="fx-obsidian__actions">
      <a class="fx-obsidian__cta fx-obsidian__cta--primary" href="#">See the range</a>
      <a class="fx-obsidian__cta fx-obsidian__cta--ghost" href="#">How it is made</a>
    </div>
  </div>
</section>
