<!-- sg-teeming section. Finished at rest with CSS alone: the gradients in
     .fx-teem__rest are the hero with JavaScript off, and index.js only covers them
     with a WebGL canvas once it has the shader, a context and a linked
     program. The _fx paths are root-absolute because a site always sits at the
     origin root. The decorative layers carry aria-hidden; the copy is the only
     thing a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/sg-teeming/style.css">
<section class="fx-teem" data-fx="sg-teeming">
  <div class="fx-teem__rest" aria-hidden="true"></div>
  <div class="fx-teem__scrim" aria-hidden="true"></div>
  <div class="fx-teem__grain" aria-hidden="true"></div>
  <div class="fx-teem__inner">
    <p class="fx-teem__eyebrow"><span class="fx-teem__dot" aria-hidden="true"></span>Cast in house</p>
    <h1 class="fx-teem__title">Poured hot, made to last.</h1>
    <p class="fx-teem__lede">Replace this copy with your own. The headline takes one line or three, and the metal keeps running out through the moulds behind it either way.</p>
    <div class="fx-teem__actions">
      <a class="fx-teem__cta fx-teem__cta--primary" href="#">See the work</a>
      <a class="fx-teem__cta fx-teem__cta--ghost" href="#">Visit the shop</a>
    </div>
  </div>
</section>
