<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" width="640" height="540" fill="none">
  <defs>
    <!-- Deep translucent glass body -->
    <radialGradient id="bodyFill" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(140 65) rotate(90) scale(205 205)">
      <stop offset="0" stop-color="#152033" stop-opacity="0.92"/>
      <stop offset="0.52" stop-color="#0A0E17" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#02040A" stop-opacity="1"/>
    </radialGradient>

    <!-- Cool white/blue rim -->
    <linearGradient id="rim" x1="52" y1="30" x2="270" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FCFF"/>
      <stop offset="0.28" stop-color="#D6E7FF"/>
      <stop offset="0.62" stop-color="#8CAFFF"/>
      <stop offset="0.84" stop-color="#A98CFF"/>
      <stop offset="1" stop-color="#83A2FF"/>
    </linearGradient>

    <!-- Blue-violet floor glow -->
    <radialGradient id="floorGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(160 224) rotate(90) scale(34 118)">
      <stop offset="0" stop-color="#AFC4FF" stop-opacity="0.36"/>
      <stop offset="0.40" stop-color="#7E9FFF" stop-opacity="0.20"/>
      <stop offset="0.72" stop-color="#7D62FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7D62FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle inner sheen -->
    <linearGradient id="sheen" x1="73" y1="40" x2="180" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.30" stop-color="#DCEAFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Ambient halo -->
  <ellipse cx="160" cy="218" rx="104" ry="34" fill="#6D8DFF" opacity="0.16" filter="url(#glow)"/>

  <!-- Ground reflection -->
  <ellipse cx="160" cy="226" rx="92" ry="17" fill="url(#floorGlow)" filter="url(#softBlur)"/>
  <ellipse cx="160" cy="226" rx="69" ry="7" fill="#B7CAFF" opacity="0.22" filter="url(#softBlur)"/>

  <!-- LEFT EAR -->
  <path
    d="M76 74
       C51 77 35 95 31 119
       C27 141 35 161 51 168
       C67 175 83 160 88 138
       C93 116 95 91 88 80
       C85 75 81 73 76 74Z"
    fill="url(#bodyFill)"
    stroke="url(#rim)"
    stroke-width="2.4"
    stroke-linejoin="round"/>

  <!-- RIGHT EAR -->
  <path
    d="M244 74
       C269 77 285 95 289 119
       C293 141 285 161 269 168
       C253 175 237 160 232 138
       C227 116 225 91 232 80
       C235 75 239 73 244 74Z"
    fill="url(#bodyFill)"
    stroke="url(#rim)"
    stroke-width="2.4"
    stroke-linejoin="round"/>

  <!-- MAIN PUPPY HEAD -->
  <path
    d="M160 29
       C119 28 84 46 68 78
       C54 107 54 149 66 181
       C76 208 107 225 160 226
       C213 225 244 208 254 181
       C266 149 266 107 252 78
       C236 46 201 28 160 29Z"
    fill="url(#bodyFill)"
    stroke="url(#rim)"
    stroke-width="2.6"
    stroke-linejoin="round"/>

  <!-- Upper glass reflection -->
  <path
    d="M92 63
       C111 41 135 34 160 35
       C183 36 204 43 220 56
       C202 54 181 55 159 60
       C134 66 112 74 87 88
       C87 78 89 69 92 63Z"
    fill="url(#sheen)"/>

  <!-- Left rim highlight -->
  <path
    d="M63 96 C69 72 83 56 103 47"
    stroke="#FFFFFF"
    stroke-width="3.8"
    stroke-linecap="round"
    opacity="0.33"/>

  <path
    d="M255 96 C249 72 237 57 219 48"
    stroke="#FFFFFF"
    stroke-width="3.4"
    stroke-linecap="round"
    opacity="0.21"/>

  <!-- Idle eyes -->
  <rect x="105" y="91" width="25" height="51" rx="12.5" fill="#F7FBFF"/>
  <rect x="190" y="91" width="25" height="51" rx="12.5" fill="#F7FBFF"/>

  <!-- Tiny eye glass catches -->
  <circle cx="113" cy="103" r="2.4" fill="#FFFFFF" opacity="0.38"/>
  <circle cx="198" cy="103" r="2.4" fill="#FFFFFF" opacity="0.38"/>
</svg>
