<!-- wipe-glass section. Finished at rest with CSS alone: .fx-wipe__rest is the
     fogged pane with the street behind it and two streaks where a hand has
     been, and index.js only covers it once the canvas has painted a frame. The
     _fx paths are root-absolute because a site always sits at the origin root,
     and "./_fx/..." would break on a nested page such as /blog/post.html. The
     decorative layers carry aria-hidden; the copy is the only thing a screen
     reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/wipe-glass/style.css">
<section class="fx-wipe" data-fx="wipe-glass">
  <div class="fx-wipe__rest" aria-hidden="true"></div>
  <div class="fx-wipe__frame" aria-hidden="true"></div>
  <div class="fx-wipe__scrim" aria-hidden="true"></div>
  <div class="fx-wipe__inner">
    <p class="fx-wipe__eyebrow"><span class="fx-wipe__dot" aria-hidden="true"></span>Late shift</p>
    <h1 class="fx-wipe__title">Drag across the glass and the street comes back.</h1>
    <p class="fx-wipe__lede">Swap this for your own words. The fog is on your side of the window, so clearing it is something you do rather than something you watch, and it closes over again a few seconds after you stop.</p>
    <div class="fx-wipe__actions">
      <a class="fx-wipe__cta fx-wipe__cta--primary" href="#">Book a table</a>
      <a class="fx-wipe__cta fx-wipe__cta--ghost" href="#">See the room</a>
    </div>
  </div>
</section>
