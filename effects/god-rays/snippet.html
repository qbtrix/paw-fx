<!-- god-rays section. Finished at rest with CSS alone: the conic fan in
     .fx-rays__rest is the hero with JavaScript off, and index.js only covers it
     with a WebGL canvas once it has a context and a linked program. The _fx
     paths are root-absolute because a site always sits at the origin root, and
     "./_fx/..." would break on a nested page such as /blog/post.html. The three
     decorative layers carry aria-hidden; the copy is the only thing a screen
     reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/god-rays/style.css">
<section class="fx-rays" data-fx="god-rays">
  <div class="fx-rays__rest" aria-hidden="true"></div>
  <div class="fx-rays__scrim" aria-hidden="true"></div>
  <div class="fx-rays__grain" aria-hidden="true"></div>
  <div class="fx-rays__inner">
    <p class="fx-rays__eyebrow">Infrastructure, unbundled</p>
    <h1 class="fx-rays__title">Every request, accounted for.</h1>
    <p class="fx-rays__lede">Replace this copy with your own. The headline holds one line or three, and the light keeps moving behind it either way.</p>
    <div class="fx-rays__actions">
      <a class="fx-rays__cta" href="#">Read the docs</a>
      <p class="fx-rays__note">No card. Free up to 10M events.</p>
    </div>
    <ul class="fx-rays__meta">
      <li>SOC 2 Type II</li>
      <li>99.99% uptime</li>
      <li>17 regions</li>
    </ul>
  </div>
</section>
