<!-- sg-bough section. Finished at rest with CSS alone: .fx-bough__rest is the
     hero with JavaScript off, and index.js only covers it with a canvas once it
     has a context and a linked program. The _fx paths are root-absolute because
     a site always sits at the origin root, and "./_fx/..." would break on a
     nested page such as /blog/post.html. The decorative layers carry
     aria-hidden; the copy is the only thing a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/sg-bough/style.css">
<section class="fx-bough" data-fx="sg-bough">
  <div class="fx-bough__rest" aria-hidden="true"></div>
  <div class="fx-bough__leaves fx-bough__leaves--far" aria-hidden="true"></div>
  <div class="fx-bough__leaves" aria-hidden="true"></div>
  <div class="fx-bough__scrim" aria-hidden="true"></div>
  <div class="fx-bough__grain" aria-hidden="true"></div>
  <div class="fx-bough__inner">
    <p class="fx-bough__eyebrow">Made for the small hours</p>
    <h1 class="fx-bough__title">Work that keeps its own quiet.</h1>
    <p class="fx-bough__lede">Replace this copy with your own. The headline holds one line or three, and the leaves keep nodding beside it.</p>
    <div class="fx-bough__actions">
      <a class="fx-bough__cta fx-bough__cta--primary" href="#">Begin</a>
      <a class="fx-bough__cta fx-bough__cta--ghost" href="#">What it does</a>
    </div>
  </div>
</section>
