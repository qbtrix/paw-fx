<!-- sg-slipface section. Finished at rest with CSS alone: the dunes in .fx-slip__rest
     is the hero with JavaScript off, and index.js only covers it with a WebGL
     canvas once it has the shader, a context and a linked program. The _fx
     paths are root-absolute because a site always sits at the origin root, and
     "./_fx/..." would break on a nested page such as /blog/post.html. The three
     decorative layers carry aria-hidden; the copy is the only thing a screen
     reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/sg-slipface/style.css">
<section class="fx-slip" data-fx="sg-slipface">
  <div class="fx-slip__rest" aria-hidden="true"></div>
  <div class="fx-slip__scrim" aria-hidden="true"></div>
  <div class="fx-slip__grain" aria-hidden="true"></div>
  <div class="fx-slip__inner">
    <p class="fx-slip__eyebrow"><span class="fx-slip__dot" aria-hidden="true"></span>Field notes</p>
    <h1 class="fx-slip__title">Go further than the map goes.</h1>
    <p class="fx-slip__lede">Replace this copy with your own. The headline slot takes one line or three, and the sand keeps blowing off the crests either way.</p>
    <div class="fx-slip__actions">
      <a class="fx-slip__cta fx-slip__cta--primary" href="#">Plan a trip</a>
      <a class="fx-slip__cta fx-slip__cta--ghost" href="#">See the routes</a>
    </div>
  </div>
</section>
