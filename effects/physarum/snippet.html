<!-- physarum section. Finished at rest with CSS alone: a black ground with
     faint cyan and magenta glows where upstream's network grows thickest, and
     the copy on a smoked panel. index.js adds the WebGL2 slime mould under the
     copy. Move the pointer to feed it; press and hold for a feast. The _fx
     paths are root-absolute because a site always sits at the origin root. -->
<link rel="stylesheet" href="/_fx/effects/physarum/style.css">
<section class="fx-physarum" data-fx="physarum">
  <div class="fx-physarum__inner">
    <p class="fx-physarum__eyebrow">Grown, not drawn</p>
    <h1 class="fx-physarum__title">It finds the shortest way</h1>
    <p class="fx-physarum__lede">A quarter of a million agents lay a trail and follow it. Move your pointer to feed them and watch the network reroute.</p>
    <div class="fx-physarum__actions">
      <a class="fx-physarum__cta fx-physarum__cta--primary" href="#">Get started</a>
      <a class="fx-physarum__cta fx-physarum__cta--ghost" href="#">See how</a>
    </div>
  </div>
</section>
