<!-- sg-agate section. Finished at rest with CSS alone: the banded rings in
     .fx-agate__rest are the hero with JavaScript off, and index.js only covers
     them with a WebGL canvas once it has the shader, a context and a linked
     program. The _fx paths are root-absolute because a site always sits at the
     origin root. The decorative layers carry aria-hidden; the copy is the only
     thing a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/sg-agate/style.css">
<section class="fx-agate" data-fx="sg-agate">
  <div class="fx-agate__rest" aria-hidden="true"></div>
  <div class="fx-agate__scrim" aria-hidden="true"></div>
  <div class="fx-agate__grain" aria-hidden="true"></div>
  <div class="fx-agate__inner">
    <p class="fx-agate__eyebrow"><span class="fx-agate__dot" aria-hidden="true"></span>Cut and polished</p>
    <h1 class="fx-agate__title">Layer on layer, laid down slowly.</h1>
    <p class="fx-agate__lede">Replace this copy with your own. The headline takes one line or three, and the light keeps drifting through the stone behind it either way.</p>
    <div class="fx-agate__actions">
      <a class="fx-agate__cta fx-agate__cta--primary" href="#">See the collection</a>
      <a class="fx-agate__cta fx-agate__cta--ghost" href="#">How it is made</a>
    </div>
  </div>
</section>
