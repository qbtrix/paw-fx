<!-- dock-magnify section. Finished at rest with CSS alone: the bar is a full
     row of real links at --fx-dock-size, which is upstream's own
     disableMagnification mode. A blocked script or prefers-reduced-motion
     leaves working navigation, not a broken control.
     The glyphs are plain inline SVG so nothing has to be fetched; swap them
     for your own icon set and keep the aria-label and the .fx-dock__tip label
     in step, because a dock of pictures is unreadable without them.
     The _fx path is root-absolute: a site always sits at the origin root, and
     "./_fx/..." would break on a nested page such as /blog/post.html. -->
<link rel="stylesheet" href="/_fx/effects/dock-magnify/style.css">
<section class="fx-dock" data-fx="dock-magnify">
  <div class="fx-dock__inner">
    <p class="fx-dock__eyebrow">Everything, one reach away</p>
    <h2 class="fx-dock__title">The bar knows where you are pointing.</h2>
    <p class="fx-dock__lede">Replace this copy with your own. The dock works as a utility bar, a footer nav or a tool switcher; each icon grows as the pointer nears it and settles on a spring rather than snapping.</p>
  </div>
  <nav class="fx-dock__bar" aria-label="Quick links">
    <a class="fx-dock__item" href="#home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M10 21v-6h4v6"/></svg>
      <span class="fx-dock__tip">Home</span>
    </a>
    <a class="fx-dock__item" href="#work" aria-label="Work">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg>
      <span class="fx-dock__tip">Work</span>
    </a>
    <a class="fx-dock__item" href="#writing" aria-label="Writing">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M15.5 4.5 7 13l-.8 3.8L10 16l8.5-8.5a2.1 2.1 0 0 0-3-3Z"/></svg>
      <span class="fx-dock__tip">Writing</span>
    </a>
    <a class="fx-dock__item" href="#gallery" aria-label="Gallery">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9.5" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg>
      <span class="fx-dock__tip">Gallery</span>
    </a>
    <a class="fx-dock__item" href="#pricing" aria-label="Pricing">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M14.8 9.4a3 3 0 0 0-5.6 1.3c0 2.6 5.6 1.4 5.6 3.9a3 3 0 0 1-5.6 1.3"/></svg>
      <span class="fx-dock__tip">Pricing</span>
    </a>
    <a class="fx-dock__item" href="#contact" aria-label="Contact">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
      <span class="fx-dock__tip">Contact</span>
    </a>
  </nav>
</section>
