<!-- smoke-ring section. Finished at rest with CSS alone: the ring in
     .fx-smoke__rest is the hero with JavaScript off, and index.js only covers
     it with a WebGL canvas once it has a context and a linked program. The _fx
     paths are root-absolute because a site always sits at the origin root, and
     "./_fx/..." would break on a nested page such as /blog/post.html. The three
     decorative layers carry aria-hidden; the copy is the only thing a screen
     reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/smoke-ring/style.css">
<section class="fx-smoke" data-fx="smoke-ring">
  <div class="fx-smoke__rest" aria-hidden="true"></div>
  <div class="fx-smoke__scrim" aria-hidden="true"></div>
  <div class="fx-smoke__grain" aria-hidden="true"></div>
  <div class="fx-smoke__inner">
    <p class="fx-smoke__eyebrow"><span class="fx-smoke__dot" aria-hidden="true"></span>One thing, done properly</p>
    <h1 class="fx-smoke__title">Clear in the middle.</h1>
    <p class="fx-smoke__lede">Your line goes here. Keep it short, because the calm centre is only so wide before the smoke closes in.</p>
    <div class="fx-smoke__actions">
      <a class="fx-smoke__cta fx-smoke__cta--primary" href="#">Begin</a>
      <a class="fx-smoke__cta fx-smoke__cta--ghost" href="#">Why it works</a>
    </div>
  </div>
</section>
