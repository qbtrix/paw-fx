<!-- event-horizon section. Finished at rest with CSS alone: .fx-horizon__rest
     is the black hole and its disk drawn flat, and index.js only covers it
     once the ray tracer has drawn a frame. The _fx paths are root-absolute
     because a site always sits at the origin root. Decorative layers carry
     aria-hidden; the copy is the only thing a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/event-horizon/style.css">
<section class="fx-horizon" data-fx="event-horizon">
  <div class="fx-horizon__rest" aria-hidden="true"></div>
  <div class="fx-horizon__scrim" aria-hidden="true"></div>
  <div class="fx-horizon__inner">
    <p class="fx-horizon__eyebrow"><span class="fx-horizon__dot" aria-hidden="true"></span>Past the point of no return</p>
    <h1 class="fx-horizon__title">Everything nearby bends toward it.</h1>
    <p class="fx-horizon__lede">Swap this for your own words. Drag sideways to fly around the hole and watch the far side of the disk lens up over the top.</p>
    <div class="fx-horizon__actions">
      <a class="fx-horizon__cta fx-horizon__cta--primary" href="#">Fall in</a>
      <a class="fx-horizon__cta fx-horizon__cta--ghost" href="#">How it works</a>
    </div>
  </div>
</section>
