<!-- mesh-gradient section. Finished at rest with CSS alone: the four blooms in
     .fx-mesh__rest are the hero with JavaScript off, and index.js only covers
     them with a WebGL canvas once it has a context and a linked program.
     The _fx paths are root-absolute because a site always sits at the origin
     root, and "./_fx/..." would break on a nested page such as /blog/post.html.
     The three decorative layers carry aria-hidden; the copy is the only thing
     a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/mesh-gradient/style.css">
<section class="fx-mesh" data-fx="mesh-gradient">
  <div class="fx-mesh__rest" aria-hidden="true"></div>
  <div class="fx-mesh__scrim" aria-hidden="true"></div>
  <div class="fx-mesh__grain" aria-hidden="true"></div>
  <div class="fx-mesh__inner">
    <p class="fx-mesh__eyebrow">Now in open beta</p>
    <h1 class="fx-mesh__title">Everything your team ships, in one place.</h1>
    <p class="fx-mesh__lede">Replace this copy with your own. The headline slot takes one line or three, and the gradient keeps moving behind it either way.</p>
    <div class="fx-mesh__actions">
      <a class="fx-mesh__cta fx-mesh__cta--primary" href="#">Start free</a>
      <a class="fx-mesh__cta fx-mesh__cta--ghost" href="#">Book a walkthrough</a>
    </div>
  </div>
</section>
