     both textures have loaded. A blocked script, a pruned bundle, a refused
     context or a lost context all leave that first picture on screen. Under
     prefers-reduced-motion the nav still changes picture -- instantly, with
     nothing on the GPU and no timer advancing it on its own.

     THE IMAGE SLOT IS THE src. The shader samples the picture's actual pixels, so
     unlike most galleries here it cannot be a CSS background. These six are
     generated SVG plates; upstream's portraits do not ship. Swap one for your own
     by changing one attribute:
       <img class="fx-glass__img" alt="" src="/img/1.jpg">
     Keep the <img> list and the nav button list the same length -- the slide count
     is read from the markup.

     The _fx path is root-absolute: a site always sits at the origin root, and
     "./_fx/..." would break on a nested page such as /blog/post.html. -->
