<!-- sg-sheen section. Finished at rest with CSS alone: the fringe rivers in
     .fx-sheen__rest and the thread grid in .fx-sheen__weave are the hero with
     JavaScript off, and index.js only covers them with a WebGL canvas once it
     has the shader, a context and a linked program. The _fx paths are
     root-absolute because a site always sits at the origin root, and
     "./_fx/..." would break on a nested page such as /blog/post.html. The four
     decorative layers carry aria-hidden; the copy is the only thing a screen
     reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/sg-sheen/style.css">
<section class="fx-sheen" data-fx="sg-sheen">
  <div class="fx-sheen__rest" aria-hidden="true"></div>
  <div class="fx-sheen__weave" aria-hidden="true"></div>
  <div class="fx-sheen__scrim" aria-hidden="true"></div>
  <div class="fx-sheen__grain" aria-hidden="true"></div>
  <div class="fx-sheen__inner">
    <p class="fx-sheen__eyebrow"><span class="fx-sheen__dot" aria-hidden="true"></span>Two layers, one pattern</p>
    <h1 class="fx-sheen__title">Small differences, visible at last.</h1>
    <p class="fx-sheen__lede">Swap in your own copy. The headline takes one line or three, and the fringes keep sliding through the weave behind it.</p>
    <div class="fx-sheen__actions">
      <a class="fx-sheen__cta fx-sheen__cta--primary" href="#">Run a comparison</a>
      <a class="fx-sheen__cta fx-sheen__cta--ghost" href="#">See a sample report</a>
    </div>
  </div>
</section>
