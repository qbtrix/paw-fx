<!-- water section. Finished at rest with CSS alone: .fx-water__rest is the
     hero with JavaScript off, and index.js only covers it with a canvas once it
     has a context and a linked program. The _fx paths are root-absolute because
     a site always sits at the origin root, and "./_fx/..." would break on a
     nested page such as /blog/post.html. The decorative layers carry
     aria-hidden; the copy is the only thing a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/water/style.css">
<section class="fx-water" data-fx="water">
  <div class="fx-water__rest" aria-hidden="true"></div>
  <div class="fx-water__caustics" aria-hidden="true"></div>
  <div class="fx-water__scrim" aria-hidden="true"></div>
  <div class="fx-water__grain" aria-hidden="true"></div>
  <div class="fx-water__inner">
    <p class="fx-water__eyebrow">Depth on demand</p>
    <h1 class="fx-water__title">Everything below the surface, surfaced.</h1>
    <p class="fx-water__lede">Replace this copy with your own. The headline holds one line or three, and the water keeps moving behind it either way.</p>
    <div class="fx-water__actions">
      <a class="fx-water__cta fx-water__cta--primary" href="#">Start free</a>
      <a class="fx-water__cta fx-water__cta--ghost" href="#">Watch the tour</a>
    </div>
  </div>
</section>
