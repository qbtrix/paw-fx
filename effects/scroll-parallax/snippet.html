<!-- scroll-parallax section. Finished at rest with CSS alone, and the parallax
     is CSS too: the four layers and the copy are moved by
     `animation-timeline: view()`, so nothing here needs JavaScript to run.
     A browser without scroll-driven animations, and a visitor who asked for
     less motion, both get the still composition -- and because the keyframes
     are symmetric around zero, that still frame is the midpoint of the travel
     rather than one end of it.
     The _fx path is root-absolute because a site always sits at the origin
     root, and "./_fx/..." would break on a nested page such as /blog/post.html.
     The four layers carry aria-hidden; the copy is the only thing a screen
     reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/scroll-parallax/style.css">
<section class="fx-para" data-fx="scroll-parallax">
  <div class="fx-para__layer fx-para__sky" aria-hidden="true"></div>
  <div class="fx-para__layer fx-para__stars" aria-hidden="true"></div>
  <div class="fx-para__layer fx-para__far" aria-hidden="true"></div>
  <div class="fx-para__layer fx-para__near" aria-hidden="true"></div>
  <div class="fx-para__inner">
    <p class="fx-para__eyebrow">Chapter two</p>
    <h1 class="fx-para__title">Depth, without a scroll library.</h1>
    <p class="fx-para__lede">Replace this copy with your own. Four layers move at four rates as the section passes the viewport, and the whole thing is a stylesheet.</p>
  </div>
</section>
