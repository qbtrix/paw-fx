<!-- sg-nave section. Finished at rest with CSS alone: the far glow and the
     slanting shafts in .fx-nave__rest are the hero with JavaScript off,
     and index.js only covers them with a WebGL canvas once it has the shader, a
     context and a linked program. The _fx paths are root-absolute because a
     site always sits at the origin root, and "./_fx/..." would break on a
     nested page such as /blog/post.html. The three decorative layers carry
     aria-hidden; the copy is the only thing a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/sg-nave/style.css">
<section class="fx-nave" data-fx="sg-nave">
  <div class="fx-nave__rest" aria-hidden="true"></div>
  <div class="fx-nave__scrim" aria-hidden="true"></div>
  <div class="fx-nave__grain" aria-hidden="true"></div>
  <div class="fx-nave__inner">
    <p class="fx-nave__eyebrow"><span class="fx-nave__dot" aria-hidden="true"></span>Open by appointment</p>
    <h1 class="fx-nave__title">Some rooms ask you to slow down.</h1>
    <p class="fx-nave__lede">Replace this copy with your own. The headline slot takes one line or three, and the light keeps moving across the stone either way.</p>
    <div class="fx-nave__actions">
      <a class="fx-nave__cta fx-nave__cta--primary" href="#">Plan a visit</a>
      <a class="fx-nave__cta fx-nave__cta--ghost" href="#">Read the history</a>
    </div>
  </div>
</section>
