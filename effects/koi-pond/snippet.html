<!-- koi-pond section. Finished at rest with CSS alone: .fx-koi-pond__rest is
     the night pond with the moon's glow and a few lily pads, and index.js
     fades it only once its canvas has drawn a frame. The _fx path is
     root-absolute because a site always sits at the origin root, and
     "./_fx/..." would break on a nested page such as /blog/post.html. The
     decorative layers carry aria-hidden; the copy is the only thing a screen
     reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/koi-pond/style.css">
<section class="fx-koi-pond" data-fx="koi-pond">
  <div class="fx-koi-pond__rest" aria-hidden="true"></div>
  <div class="fx-koi-pond__inner">
    <p class="fx-koi-pond__eyebrow">After dark</p>
    <h1 class="fx-koi-pond__title">Slow down. The pond is still awake.</h1>
    <p class="fx-koi-pond__lede">Swap this for your own words. Koi drift in loose schools under the moon, and every one of them leaves a ring on the water.</p>
    <a class="fx-koi-pond__cta" href="#">Take a look</a>
  </div>
</section>
