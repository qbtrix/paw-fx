<!-- plane-morph section. Finished at rest with CSS alone: the band below is five
     real pictures with captions, and index.js only fades them out once a WebGL
     context exists and the planes are parked over their boxes. A blocked script,
     a pruned bundle, a refused context, a lost context or prefers-reduced-motion
     all leave the band exactly as it reads here -- and under reduced motion the
     views still swap, instantly, so nothing is locked behind an animation.

     BOTH VIEWS ARE ALWAYS LAID OUT. The detail view below is not display:none:
     the transition tweens a plane from the rect it has in the band to the rect it
     has in the detail view, so that rect must already exist when the tween starts.
     It is opacity 0 and inert until it is the showing view.

     THE IMAGE SLOT IS THE src. The plane's texture is read from the slot's own
     <img>, so it cannot be a CSS background. These five are generated SVG plates;
     upstream's Unsplash photographs do not ship. Swap one for your own picture by
     changing one attribute:
       <img class="fx-morph__img" alt="" src="/img/1.jpg">
     The detail view's five slots all carry the SAME plate, and that is not an
     oversight: every plane there reuses the clicked picture's texture, which is
     what upstream does too. When the GPU is driving, data-fx-live hides all of
     them and the planes paint instead; under reduced motion index.js points
     them at whichever picture was clicked, so the detail view is a real
     composition rather than five empty boxes.

     The _fx path is root-absolute: a site always sits at the origin root, and
     "./_fx/..." would break on a nested page such as /blog/post.html. -->
