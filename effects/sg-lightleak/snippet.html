<!-- sg-lightleak section. Finished at rest with CSS alone: the edge blooms and
     the anamorphic streaks in .fx-lightleak__rest are the hero with JavaScript
     off, and index.js only covers them with a WebGL canvas once it has the
     shader, a context and a linked program. The _fx paths are root-absolute
     because a site always sits at the origin root, and "./_fx/..." would break
     on a nested page such as /blog/post.html. The three decorative layers carry
     aria-hidden; the copy is the only thing a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/sg-lightleak/style.css">
<section class="fx-lightleak" data-fx="sg-lightleak">
  <div class="fx-lightleak__rest" aria-hidden="true"></div>
  <div class="fx-lightleak__scrim" aria-hidden="true"></div>
  <div class="fx-lightleak__grain" aria-hidden="true"></div>
  <div class="fx-lightleak__inner">
    <p class="fx-lightleak__eyebrow"><span class="fx-lightleak__dot" aria-hidden="true"></span>Roll one</p>
    <h1 class="fx-lightleak__title">The light got in before we did.</h1>
    <p class="fx-lightleak__lede">Swap this for your own words. The headline takes one line or three, and the leaks keep bleeding in from the edges either way.</p>
    <div class="fx-lightleak__actions">
      <a class="fx-lightleak__cta fx-lightleak__cta--primary" href="#">See the roll</a>
      <a class="fx-lightleak__cta fx-lightleak__cta--ghost" href="#">How it was shot</a>
    </div>
  </div>
</section>
