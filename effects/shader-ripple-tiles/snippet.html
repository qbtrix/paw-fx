<!-- shader-ripple-tiles section. Finished at rest with CSS alone: the grid
     below is four real images at full opacity, and index.js only fades them
     out once a WebGL context exists and the planes are placed over them. A
     blocked script, a pruned bundle, a refused context or
     prefers-reduced-motion all leave the picture grid exactly as it reads
     here.

     THE IMAGE SLOT IS THE src. The plate is the texture the shader samples,
     so unlike the other galleries here it cannot be a CSS background. These
     four are generated SVG plates -- none of upstream's 6.5 MB of imagery
     ships. Swap in your own picture by changing one attribute:
       <img class="fx-tiles__img" alt="" src="/img/1.jpg">

     The _fx path is root-absolute: a site always sits at the origin root, and
     "./_fx/..." would break on a nested page such as /blog/post.html. -->
