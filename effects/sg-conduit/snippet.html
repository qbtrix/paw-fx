<!-- sg-conduit section. Finished at rest with CSS alone: the fume glow and the
     lit seams in .fx-conduit__rest are the hero with JavaScript off,
     and index.js only covers them with a WebGL canvas once it has the shader, a
     context and a linked program. The _fx paths are root-absolute because a
     site always sits at the origin root, and "./_fx/..." would break on a
     nested page such as /blog/post.html. The three decorative layers carry
     aria-hidden; the copy is the only thing a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/sg-conduit/style.css">
<section class="fx-conduit" data-fx="sg-conduit">
  <div class="fx-conduit__rest" aria-hidden="true"></div>
  <div class="fx-conduit__scrim" aria-hidden="true"></div>
  <div class="fx-conduit__grain" aria-hidden="true"></div>
  <div class="fx-conduit__inner">
    <p class="fx-conduit__eyebrow"><span class="fx-conduit__dot" aria-hidden="true"></span>Deep tech, made plain</p>
    <h1 class="fx-conduit__title">Built for the heat underneath.</h1>
    <p class="fx-conduit__lede">Replace this copy with your own. The headline slot takes one line or three, and the seams keep glowing down the tunnel either way.</p>
    <div class="fx-conduit__actions">
      <a class="fx-conduit__cta fx-conduit__cta--primary" href="#">Get started</a>
      <a class="fx-conduit__cta fx-conduit__cta--ghost" href="#">See how it works</a>
    </div>
  </div>
</section>
