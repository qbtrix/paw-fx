<!-- meduse section. Finished at rest with CSS alone: upstream's black ground
     with a faint glow where the lead jellyfish floats, and the copy on a
     smoked panel. index.js adds the WebGL2 school under the copy. Move the
     pointer over the section to lead it, click to startle it. The _fx paths
     are root-absolute because a site always sits at the origin root. -->
<link rel="stylesheet" href="/_fx/effects/meduse/style.css">
<section class="fx-meduse" data-fx="meduse">
  <div class="fx-meduse__inner">
    <p class="fx-meduse__eyebrow">Drawn with light</p>
    <h1 class="fx-meduse__title">Follow the slow ones</h1>
    <p class="fx-meduse__lede">A school of jellyfish beats in the dark. Move your pointer and the lead drifts after it. Tap and they all flinch.</p>
    <div class="fx-meduse__actions">
      <a class="fx-meduse__cta fx-meduse__cta--primary" href="#">Get started</a>
      <a class="fx-meduse__cta fx-meduse__cta--ghost" href="#">See how</a>
    </div>
  </div>
</section>
