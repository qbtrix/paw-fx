<!-- vanta-globe section. Finished at rest with CSS alone: the wireframe globe
     and node field in .fx-globe__rest are the hero with JavaScript off, and
     index.js only covers them with a WebGL canvas once it holds a context and
     has rendered a frame. That fallback is load-bearing here rather than
     decorative -- the context is requested with failIfMajorPerformanceCaveat,
     so a machine with hardware acceleration off never gets the canvas at all.
     The copy takes the left of the frame and the globe the right, matching the
     camera's look target in the live scene; both re-centre below 720px.
     The _fx paths are root-absolute because a site always sits at the origin
     root, and "./_fx/..." would break on a nested page such as /blog/post.html.
     The decorative layers carry aria-hidden; the copy is the only thing a
     screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/vanta-globe/style.css">
<section class="fx-globe" data-fx="vanta-globe">
  <div class="fx-globe__rest" aria-hidden="true">
    <span class="fx-globe__orb"></span>
    <span class="fx-globe__spokes"></span>
  </div>
  <div class="fx-globe__scrim" aria-hidden="true"></div>
  <div class="fx-globe__grain" aria-hidden="true"></div>
  <div class="fx-globe__inner">
    <p class="fx-globe__eyebrow">Deployed in 31 regions</p>
    <h1 class="fx-globe__title">Close to every customer you have.</h1>
    <p class="fx-globe__lede">Replace this copy with your own. The headline slot takes one line or three, and the globe keeps turning beside it either way.</p>
    <div class="fx-globe__actions">
      <a class="fx-globe__cta fx-globe__cta--primary" href="#">Start free</a>
      <a class="fx-globe__cta fx-globe__cta--ghost" href="#">See the network</a>
    </div>
  </div>
</section>
