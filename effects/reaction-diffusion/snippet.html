<!-- reaction-diffusion section. Finished at rest with CSS alone: the deep
     blue dish of upstream's coral palette with soft teal and amber washes, and
     the copy on a smoked panel. index.js adds the WebGL2 Gray-Scott dish under
     the copy. Press and drag to seed a new colony; shift-drag erases. The _fx
     paths are root-absolute because a site always sits at the origin root. -->
<link rel="stylesheet" href="/_fx/effects/reaction-diffusion/style.css">
<section class="fx-rd" data-fx="reaction-diffusion">
  <div class="fx-rd__inner">
    <p class="fx-rd__eyebrow">Two chemicals, two lines of math</p>
    <h1 class="fx-rd__title">Patterns that grow themselves</h1>
    <p class="fx-rd__lede">Spots, stripes and coral from the same reaction, computed live on the GPU. Press and drag to seed a new colony and watch it spread.</p>
    <div class="fx-rd__actions">
      <a class="fx-rd__cta fx-rd__cta--primary" href="#">Get started</a>
      <a class="fx-rd__cta fx-rd__cta--ghost" href="#">See how</a>
    </div>
  </div>
</section>
