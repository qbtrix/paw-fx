<!-- paper-marbling section. Finished at rest with CSS alone: the istanbul
     bath (#efe6d2) with a few soft drops of its inks, and the copy on a
     paper-coloured veil panel. index.js adds the WebGL2 ebru tray under the
     copy: a seeded pattern grows in, then dragging a stylus through the ink
     pulls it, exactly. The _fx paths are root-absolute because a site always
     sits at the origin root. -->
<link rel="stylesheet" href="/_fx/effects/paper-marbling/style.css">
<section class="fx-marbling" data-fx="paper-marbling">
  <div class="fx-marbling__inner">
    <p class="fx-marbling__eyebrow">Ink on a bath of size</p>
    <h1 class="fx-marbling__title">Every stroke is exact</h1>
    <p class="fx-marbling__lede">Drops of ink float on the bath and a comb pulls them into tongues. Drag a stylus through the ink: it moves as far as you do, and the picture is drawn to the pixel.</p>
    <div class="fx-marbling__actions">
      <a class="fx-marbling__cta fx-marbling__cta--primary" href="#">Get started</a>
      <a class="fx-marbling__cta fx-marbling__cta--ghost" href="#">See how</a>
    </div>
  </div>
</section>
