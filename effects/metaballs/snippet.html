<!-- metaballs section. Finished at rest with CSS alone: .fx-metaballs__rest is the
     hero with JavaScript off, and index.js only covers it with a canvas once it
     has a context and a linked program. The _fx paths are root-absolute because
     a site always sits at the origin root, and "./_fx/..." would break on a
     nested page such as /blog/post.html. The decorative layers carry
     aria-hidden; the copy is the only thing a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/metaballs/style.css">
<section class="fx-metaballs" data-fx="metaballs">
  <div class="fx-metaballs__rest" aria-hidden="true"></div>
  <div class="fx-metaballs__scrim" aria-hidden="true"></div>
  <div class="fx-metaballs__grain" aria-hidden="true"></div>
  <div class="fx-metaballs__inner">
    <p class="fx-metaballs__eyebrow">Series B</p>
    <h1 class="fx-metaballs__title">Software that behaves like a material.</h1>
    <p class="fx-metaballs__lede">Replace this copy with your own. The headline holds one line or three, and the field keeps merging behind it either way.</p>
    <div class="fx-metaballs__actions">
      <a class="fx-metaballs__cta fx-metaballs__cta--primary" href="#">Start building</a>
      <a class="fx-metaballs__cta fx-metaballs__cta--ghost" href="#">Talk to sales</a>
    </div>
  </div>
</section>
