<!-- gradient-carousel section. Finished at rest with CSS alone: the cards
     below are a plain horizontal scroll row until index.js takes them over, so
     with the script blocked, the bundle pruned or prefers-reduced-motion on,
     all ten are there and all ten are reachable. What the script adds is the
     3D wrap, the drag physics and the background sampled from the centred
     card.

     THE STAGE OWNS THE WHEEL while the pointer is over it. The carousel is
     infinite, so there is no end at which to hand the page back -- that is
     upstream's design and it is kept. The scope is the stage only: the copy
     above it scrolls the page as normal, and the section can be scrolled past
     from anywhere outside the card area.

     THE IMAGE SLOT is each card's src, and these ten are generated plates --
     none of upstream's photography ships. The pictures are what the background
     colour is sampled from, so swapping one changes what the whole section
     looks like:
       <article class="fx-gcar__card"><img class="fx-gcar__img" alt="" src="/img/1.jpg"></article>

     The _fx path is root-absolute: a site always sits at the origin root, and
     "./_fx/..." would break on a nested page such as /blog/post.html. -->

    <p class="fx-gcar__note">Drag the cards, or roll the wheel over them. Whichever card reaches the middle is sampled for its two strongest colours, and the wash behind the carousel crosses to them.</p>
