<!-- sg-fluted section. Finished at rest with CSS alone: the glows and the ribbed
     glass in .fx-flute__rest are the hero with JavaScript off, and index.js only
     covers them with a WebGL canvas once it has the shader, a context and a
     linked program. The _fx paths are root-absolute because a site always sits
     at the origin root, and "./_fx/..." would break on a nested page such as
     /blog/post.html. The three decorative layers carry aria-hidden; the copy is
     the only thing a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/sg-fluted/style.css">
<section class="fx-flute" data-fx="sg-fluted">
  <div class="fx-flute__rest" aria-hidden="true"></div>
  <div class="fx-flute__scrim" aria-hidden="true"></div>
  <div class="fx-flute__grain" aria-hidden="true"></div>
  <div class="fx-flute__inner">
    <p class="fx-flute__eyebrow"><span class="fx-flute__dot" aria-hidden="true"></span>Now in studio</p>
    <h1 class="fx-flute__title">Everything you make, seen through better glass.</h1>
    <p class="fx-flute__lede">Replace this copy with your own. The headline slot takes one line or three, and the light keeps drifting behind the ribs either way.</p>
    <div class="fx-flute__actions">
      <a class="fx-flute__cta fx-flute__cta--primary" href="#">Start a project</a>
      <a class="fx-flute__cta fx-flute__cta--ghost" href="#">See the work</a>
    </div>
  </div>
</section>
