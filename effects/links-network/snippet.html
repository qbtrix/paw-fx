<!-- links-network section. Finished at rest with CSS and markup alone: the
     inline SVG is a real constellation -- 64 nodes and every edge shorter than
     the preset's 150px link distance -- and index.js only fades it out once a
     tsParticles container has actually loaded into .fx-links__canvas. A
     blocked bundle, a refused canvas or prefers-reduced-motion all leave the
     SVG graph in place. The node positions are a fixed seeded layout because
     this is a committed file, not something rendered per page load.
     The _fx path is root-absolute: a site always sits at the origin root, and
     "./_fx/..." would break on a nested page such as /blog/post.html. -->
