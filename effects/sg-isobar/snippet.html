<!-- sg-isobar section. Finished at rest with CSS alone: .fx-isobar__rest is the
     hero with JavaScript off, and index.js only covers it with a canvas once it
     has a context and a linked program. The _fx paths are root-absolute because
     a site always sits at the origin root, and "./_fx/..." would break on a
     nested page such as /blog/post.html. The decorative layers carry
     aria-hidden; the copy is the only thing a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/sg-isobar/style.css">
<section class="fx-isobar" data-fx="sg-isobar">
  <div class="fx-isobar__rest" aria-hidden="true"></div>
  <div class="fx-isobar__scrim" aria-hidden="true"></div>
  <div class="fx-isobar__grain" aria-hidden="true"></div>
  <div class="fx-isobar__inner">
    <p class="fx-isobar__eyebrow">Forecasting, live</p>
    <h1 class="fx-isobar__title">See the weather before it lands.</h1>
    <p class="fx-isobar__lede">Replace this copy with your own. The headline holds one line or three, and the systems keep turning behind it either way.</p>
    <div class="fx-isobar__actions">
      <a class="fx-isobar__cta fx-isobar__cta--primary" href="#">Open a chart</a>
      <a class="fx-isobar__cta fx-isobar__cta--ghost" href="#">How the model works</a>
    </div>
  </div>
</section>
