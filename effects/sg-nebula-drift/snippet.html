<!-- sg-nebula-drift section. Finished at rest with CSS alone: .fx-nebula__rest is the
     hero with JavaScript off, and index.js only covers it with a canvas once it
     has a context and a linked program. The _fx paths are root-absolute because
     a site always sits at the origin root, and "./_fx/..." would break on a
     nested page such as /blog/post.html. The decorative layers carry
     aria-hidden; the copy is the only thing a screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/sg-nebula-drift/style.css">
<section class="fx-nebula" data-fx="sg-nebula-drift">
  <div class="fx-nebula__rest" aria-hidden="true"></div>
  <div class="fx-nebula__scrim" aria-hidden="true"></div>
  <div class="fx-nebula__grain" aria-hidden="true"></div>
  <div class="fx-nebula__inner">
    <p class="fx-nebula__eyebrow">Ten years of telemetry</p>
    <h1 class="fx-nebula__title">The whole system, from one vantage point.</h1>
    <p class="fx-nebula__lede">Replace this copy with your own. The headline holds one line or three, and the gas keeps drifting behind it either way.</p>
    <div class="fx-nebula__actions">
      <a class="fx-nebula__cta fx-nebula__cta--primary" href="#">Open the console</a>
      <a class="fx-nebula__cta fx-nebula__cta--ghost" href="#">Read the paper</a>
    </div>
  </div>
</section>
