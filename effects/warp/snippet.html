<!-- warp section. Finished at rest with CSS alone: the lit ridges in
     .fx-warp__rest are the hero with JavaScript off, and index.js only covers
     them with a WebGL canvas once it has a context and a linked program. The
     _fx paths are root-absolute because a site always sits at the origin root,
     and "./_fx/..." would break on a nested page such as /blog/post.html. The
     three decorative layers carry aria-hidden; the copy is the only thing a
     screen reader should reach. -->
<link rel="stylesheet" href="/_fx/effects/warp/style.css">
<section class="fx-warp" data-fx="warp">
  <div class="fx-warp__rest" aria-hidden="true"></div>
  <div class="fx-warp__scrim" aria-hidden="true"></div>
  <div class="fx-warp__grain" aria-hidden="true"></div>
  <div class="fx-warp__inner">
    <p class="fx-warp__eyebrow"><span class="fx-warp__dot" aria-hidden="true"></span>Ten turns deep</p>
    <h1 class="fx-warp__title">Bend the grid until it stops looking like one.</h1>
    <p class="fx-warp__lede">Write over this. The headline takes one line or three, and the ridges keep folding through each other behind it.</p>
    <div class="fx-warp__actions">
      <a class="fx-warp__cta fx-warp__cta--primary" href="#">Try the editor</a>
      <a class="fx-warp__cta fx-warp__cta--ghost" href="#">See the presets</a>
    </div>
  </div>
</section>
