<!-- perlin-flow-field section. Finished at rest with CSS alone: upstream's
     dark ground with its warm glow and vignette as gradients, and the copy on
     a smoked panel. index.js adds two canvases under the copy (the trails and
     upstream's glow/vignette/grain layer). The _fx paths are root-absolute
     because a site always sits at the origin root. -->
<link rel="stylesheet" href="/_fx/effects/perlin-flow-field/style.css">
<section class="fx-perlin-flow-field" data-fx="perlin-flow-field">
  <div class="fx-perlin-flow-field__inner">
    <h1 class="fx-perlin-flow-field__title">Let it find its own way</h1>
    <p class="fx-perlin-flow-field__lede">Thousands of threads follow a noise field that drifts while you read. Set a seed to keep the one you like.</p>
    <div class="fx-perlin-flow-field__actions">
      <a class="fx-perlin-flow-field__cta fx-perlin-flow-field__cta--primary" href="#">Get started</a>
      <a class="fx-perlin-flow-field__cta fx-perlin-flow-field__cta--ghost" href="#">See how</a>
    </div>
  </div>
</section>
